<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Carteirinha - {{ res.full_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; }
        
        /* Padrão CR-80 (Cartão de Crédito) */
        .card-container {
            width: 85.6mm;
            height: 54mm;
            background: white;
            border-radius: 3mm;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
        }

        /* Marca D'água */
        .watermark {
            position: absolute;
            bottom: -5px;
            right: 5px;
            font-size: 8px;
            font-weight: 900;
            color: rgba(0, 0, 0, 0.05);
            text-transform: uppercase;
            z-index: 0;
            pointer-events: none;
        }

        @media print {
            body { background: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
            .no-print { display: none !important; }
            .card-container { 
                box-shadow: none; 
                border: 1px solid #000; /* Borda fina para corte */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen gap-8">

    <div class="card-container flex flex-col">
        <div class="bg-slate-900 h-10 flex items-center justify-between px-3 text-white z-10">
            <span class="text-[10px] font-bold tracking-wide uppercase truncate max-w-[70%]">
                {{ config.condo_name }}
            </span>
            <div class="text-right leading-none">
                <span class="block text-xs font-bold text-yellow-400">{{ unit.number }}</span>
                <span class="block text-[6px] text-slate-400 uppercase">Unidade</span>
            </div>
        </div>

        <div class="flex-1 flex items-center p-3 gap-3 relative z-10">
            <div class="w-16 h-20 bg-slate-100 border border-slate-200 rounded overflow-hidden flex-shrink-0 flex items-center justify-center">
                {% if res.photo_path %}
                    <img src="/{{ res.photo_path }}" class="w-full h-full object-cover">
                {% else %}
                    <svg class="w-8 h-8 text-slate-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
                {% endif %}
            </div>

            <div class="flex-1 min-w-0">
                <h2 class="text-sm font-bold text-slate-900 leading-tight mb-1 truncate">{{ res.full_name }}</h2>
                
                {% if res.profile_type != 'DEPENDENTE' %}
                <span class="inline-block px-1.5 py-0.5 rounded text-[7px] font-bold uppercase bg-slate-100 text-slate-600 border border-slate-200 mb-2">
                    {{ res.profile_type }}
                </span>
                {% else %}
                <span class="block h-2 mb-2"></span> {% endif %}

                <div class="border-t border-slate-100 pt-1">
                    <p class="text-[6px] text-slate-400 uppercase font-bold">Acesso Piscina</p>
                    <p class="text-[9px] font-bold text-{{ cor_piscina }}-600">{{ status_piscina }}</p>
                </div>
            </div>
        </div>

        <div class="watermark">GUARDIAN SYSTEM</div>
    </div>

    <div class="no-print flex gap-4">
        <button onclick="window.print()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-indigo-700 transition flex items-center gap-2">
            🖨️ Imprimir
        </button>
        <button onclick="window.close()" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-400 transition">
            Fechar
        </button>
    </div>

</body>
</html>
