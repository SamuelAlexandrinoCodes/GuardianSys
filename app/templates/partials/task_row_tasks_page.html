<div class="task-item flex items-start gap-3 group p-3 hover:bg-slate-50 rounded-xl transition border border-transparent hover:border-slate-100" id="task-{{ task.id }}" x-data="{ done: {{ 'true' if task.status == 'CONCLUIDO' else 'false' }} }">
    <input type="checkbox" x-model="done" @change="updateCounters()"
           hx-post="/tasks/{{ task.id }}/toggle_status" hx-swap="none"
           class="task-checkbox mt-0.5 w-5 h-5 appearance-none rounded-full border-2 border-slate-300 checked:bg-indigo-600 checked:border-indigo-600 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none cursor-pointer shadow-sm transition-all relative before:content-[''] before:absolute before:inset-0 before:m-auto before:w-2 before:h-2 before:rounded-full checked:before:bg-white">

    <div class="flex-1 transition-all" :class="done ? 'opacity-50' : 'opacity-100'">
        <p class="text-sm font-bold text-slate-800" :class="done ? 'line-through' : ''">
            {{ task.title }}
        </p>
        {% if task.due_date %}
        <p class="text-[10px] mt-1 font-medium {{ 'text-red-500 font-bold bg-red-50 px-2 py-0.5 rounded w-fit' if task.due_date < date.today() and task.status != 'CONCLUIDO' else 'text-slate-400' }}">
            📅 Limite: {{ task.due_date.strftime('%d/%m/%Y') }}
        </p>
        {% endif %}
    </div>

    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        <button onclick="openReminderModal('{{ task.id }}', '{{ task.title|e }}')" class="text-slate-400 hover:text-blue-500 p-1.5 hover:bg-blue-50 rounded-lg transition" title="Adicionar Lembrete">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        </button>
        <button hx-delete="/tasks/{{ task.id }}" hx-target="#task-{{ task.id }}" hx-swap="outerHTML" class="text-slate-400 hover:text-red-500 p-1.5 hover:bg-red-50 rounded-lg transition" title="Excluir">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </div>
</div>
