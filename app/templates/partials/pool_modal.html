<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm p-4 animate-fade-in">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all border border-slate-200">
        
        <div class="bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-lg text-slate-800">Acesso Piscina</h3>
                <p class="text-xs text-indigo-600 font-bold uppercase">{{ res.full_name }}</p>
            </div>
            <button onclick="this.closest('#modal-container').innerHTML = ''" class="text-slate-400 hover:text-red-500 transition text-xl">✕</button>
        </div>

        <div class="p-6 space-y-4">
            
            <button hx-post="/resident/{{ res.id }}/pool_renew/1" 
                    hx-target="#pool-status-{{ res.id }}" 
                    hx-on::after-request="this.closest('#modal-container').innerHTML = ''"
                    class="w-full flex items-center gap-3 p-3 rounded-lg border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 transition group text-left shadow-sm">
                <div class="bg-indigo-100 text-indigo-600 p-2 rounded-full group-hover:bg-white group-hover:scale-110 transition">
                    🎫
                </div>
                <div>
                    <span class="block text-sm font-bold text-slate-700 group-hover:text-indigo-700">Passe Diário (Hoje)</span>
                    <span class="text-[10px] text-slate-400">Libera acesso até 23:59.</span>
                </div>
            </button>

            <div class="p-4 rounded-lg border border-slate-200 bg-slate-50">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">📅 Definir Validade Até:</label>
                <form hx-post="/resident/{{ res.id }}/pool_set_date" 
                      hx-target="#pool-status-{{ res.id }}"
                      hx-on::after-request="this.closest('#modal-container').innerHTML = ''"
                      class="flex gap-2">
                    
                    <input type="date" name="expiry_date" required
                           class="flex-1 border border-slate-300 rounded px-3 py-1.5 text-sm focus:ring-2 focus:ring-green-500 outline-none">
                    
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded font-bold text-xs shadow-sm transition">
                        Confirmar
                    </button>
                </form>
            </div>

            <button hx-post="/resident/{{ res.id }}/pool_block" 
                    hx-target="#pool-status-{{ res.id }}" 
                    hx-on::after-request="this.closest('#modal-container').innerHTML = ''"
                    class="w-full text-center text-xs text-red-500 hover:text-red-700 font-bold hover:underline py-2">
                🔒 Bloquear Acesso Imediatamente
            </button>
        </div>
        
        <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 text-center">
             <a href="/resident/{{ res.id }}/card" target="_blank" class="text-[10px] text-slate-500 hover:text-indigo-600 flex items-center justify-center gap-1 transition">
                🖨️ Imprimir Carteirinha Física
             </a>
        </div>
    </div>
</div>
