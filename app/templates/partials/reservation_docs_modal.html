<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" onclick="if(event.target===this)this.remove()">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[80vh] overflow-hidden" onclick="event.stopPropagation()">
        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-bold text-slate-800">📂 Documentos da Reserva</h3>
            <button type="button" onclick="this.closest('.fixed').remove()" class="text-slate-400 hover:text-slate-600 text-xl">×</button>
        </div>
        <div class="p-4">
            <p class="text-sm text-slate-600 mb-4">
                {{ res.reservation_date.strftime('%d/%m/%Y') }} — {{ res.area_name.replace('_', ' ') }} — Apto {{ res.unit.number }}
            </p>
            <form action="/reservation/{{ res.id }}/upload" method="POST" enctype="multipart/form-data" class="mb-4 flex gap-2">
                <input type="hidden" name="redirect_params" value="{{ redirect_params }}">
                <input type="file" name="file" required class="flex-1 text-xs file:px-3 file:py-1.5 file:rounded file:border-0 file:bg-indigo-50 file:text-indigo-700 file:text-xs file:font-bold">
                <button type="submit" class="bg-indigo-600 text-white px-4 py-1.5 rounded text-xs font-bold">Enviar</button>
            </form>
            <ul class="space-y-2 max-h-48 overflow-auto">
                {% for doc in documents %}
                <li id="res-doc-{{ doc.id }}" class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100 text-sm">
                    <a href="/{{ doc.filepath }}" target="_blank" class="text-indigo-600 hover:underline truncate flex items-center gap-2">📄 {{ doc.filename }}</a>
                    <button type="button" onclick="confirmAction('/document/{{ doc.id }}', '#res-doc-{{ doc.id }}', 'Excluir?', 'Remover {{ doc.filename }}?')" class="text-slate-300 hover:text-red-600 p-1">✕</button>
                </li>
                {% endfor %}
                {% if not documents %}
                <li class="text-center text-xs text-slate-400 py-4 italic">Nenhum documento anexado.</li>
                {% endif %}
            </ul>
        </div>
    </div>
</div>
