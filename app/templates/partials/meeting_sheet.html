<div class="meeting-sheet-inner flex flex-col h-full bg-slate-50" data-meeting-id="{{ m.id }}">
    <div class="flex items-start gap-4 p-6 border-b border-slate-200 bg-white">
        <span class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-lg">🤝</span>
        <div class="flex-1 min-w-0">
            <input type="text" value="{{ m.title }}" name="title" class="meeting-sheet-title w-full text-lg font-bold text-slate-800 bg-transparent border-0 border-b border-transparent hover:border-slate-200 focus:border-indigo-500 focus:ring-0 px-0 py-0.5" data-meeting-id="{{ m.id }}" placeholder="Título da reunião">
            <p class="text-sm text-slate-500 mt-1">{{ m.meeting_date.strftime('%d/%m/%Y') }}{% if m.meeting_time %} {{ m.meeting_time }}{% endif %}{% if m.company %} · {{ m.company }}{% endif %}</p>
        </div>
    </div>
    <div class="flex-1 overflow-y-auto p-6 space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Data e horário</label>
            <div class="flex gap-2">
                <input type="date" name="meeting_date" value="{{ m.meeting_date.isoformat() }}" class="border border-slate-200 rounded-lg px-3 py-2 text-sm flex-1">
                <input type="text" name="meeting_time" value="{{ m.meeting_time or '' }}" class="border border-slate-200 rounded-lg px-3 py-2 text-sm w-24 text-center font-mono" placeholder="HH:MM" maxlength="5" title="Formato 24h">
            </div>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Empresa</label>
            <input type="text" name="company" value="{{ m.company or '' }}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="Nome da empresa">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Motivo / Pauta</label>
            <input type="text" name="reason" value="{{ m.reason or '' }}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="Motivo da reunião">
        </div>
        {# --- Adicionar Participantes (Missão 6) --- #}
        <div class="border-t border-slate-200 pt-4">
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Participantes</label>
            <textarea name="participants" class="meeting-sheet-participants w-full border border-slate-200 rounded-xl p-3 h-24 resize-none text-sm focus:ring-2 focus:ring-indigo-500" placeholder="Um por linha: Nome - Telefone - E-mail" data-meeting-id="{{ m.id }}">{{ m.participants or '' }}</textarea>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Observações</label>
            <textarea name="notes" class="meeting-sheet-notes w-full border border-slate-200 rounded-xl p-3 h-20 resize-none text-sm">{{ m.notes or '' }}</textarea>
        </div>
    </div>
    <div class="p-4 border-t border-slate-200 bg-white flex items-center justify-between text-xs text-slate-500">
        <span>Criado em {{ m.created_at.strftime('%d/%m/%Y %H:%M') if m.created_at else '-' }}</span>
        <button type="button" onclick="if(typeof closeTaskSheet==='function') closeTaskSheet(); confirmAction('/administrativo/meeting/{{ m.id }}', '.meeting-item[data-meeting-id=\'{{ m.id }}\']', 'Excluir reunião', 'Tem certeza que deseja excluir esta reunião?');"
                class="p-2 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-500 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </div>
</div>
