<div class="meeting-item border-b border-slate-200 hover:bg-slate-50 transition-colors rounded-lg group/item flex items-center gap-3 py-3 px-4" data-meeting-id="{{ m.id }}">
    <span class="flex-shrink-0 w-5 h-5 rounded flex items-center justify-center text-indigo-500" aria-hidden="true">🤝</span>
    <div class="flex-1 min-w-0 cursor-text meeting-title-wrap" data-meeting-id="{{ m.id }}" role="button" tabindex="0">
        <p class="font-medium text-slate-800">{{ m.title }}</p>
        <div class="flex gap-2 mt-1 flex-wrap text-xs text-slate-500">
            <span>{{ m.meeting_date.strftime('%d/%m') }}{% if m.meeting_time %} {{ m.meeting_time }}{% endif %}</span>
            {% if m.company %}<span>🏢 {{ m.company }}</span>{% endif %}
        </div>
    </div>
    <button type="button" onclick="confirmAction('/administrativo/meeting/{{ m.id }}', '.meeting-item[data-meeting-id=\'{{ m.id }}\']', 'Excluir reunião', 'Tem certeza que deseja excluir esta reunião?')"
            class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 p-1.5 rounded transition flex-shrink-0">✕</button>
</div>
